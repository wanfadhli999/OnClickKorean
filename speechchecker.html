<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Sebutan Korea</title>
<style>
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    display: flex; 
    justify-content: center; 
    padding: 20px; 
    background-color: #ffffff;
  }
  .card { 
    border: 2px solid #1a73e8; 
    border-radius: 16px; 
    padding: 30px; 
    text-align: center; 
    width: 100%; 
    max-width: 350px; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
  }
  .tagline {
    font-size: 13px;
    color: #888;
    margin: -5px 0 15px;
    font-style: italic;
  }
  h3 { color: #555; margin-top: 0; margin-bottom: 4px; }
  .word-box { 
    font-size: 60px; 
    color: #1a73e8; 
    font-weight: bold; 
    margin: 20px 0; 
  }
  .meaning {
    font-size: 18px;
    color: #666;
    margin-bottom: 10px;
  }
  .progress {
    font-size: 13px;
    color: #999;
    margin-bottom: 20px;
  }
  .encourage-box {
    background-color: #e8f0fe;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: #1a73e8;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 10px;
  }
  button { 
    background-color: #1a73e8; 
    color: white; 
    border: none; 
    padding: 15px 25px; 
    font-size: 18px; 
    font-weight: bold;
    border-radius: 50px; 
    cursor: pointer; 
    transition: 0.3s;
    box-shadow: 0 4px 6px rgba(26, 115, 232, 0.3);
  }
  button:hover { 
    background-color: #1557b0; 
    transform: translateY(-2px);
  }
  #nextBtn {
    background-color: #e8f0fe;
    color: #1a73e8;
    box-shadow: none;
    font-size: 15px;
    padding: 15px 20px;
  }
  #nextBtn:hover {
    background-color: #d2e3fc;
  }
  #status { 
    margin-top: 25px; 
    font-size: 16px; 
    font-weight: bold;
    min-height: 24px;
  }
  .success { color: #137333; }
  .error { color: #c5221f; }
  .listening { color: #f29900; animation: pulse 1.5s infinite; }
  
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>
<div class="card">
  <h3>🇰🇷 Uji Sebutan Anda</h3>
  <p class="tagline">Berani cuba, pasti boleh!</p>

  <div class="encourage-box" id="encourageBox">
    💡 Lihat perkataan di atas, kemudian tekan butang mikrofon dan sebut dengan lantang!
  </div>

  <div class="word-box" id="targetWord">눈</div>
  <div class="meaning" id="meaning">Mata</div>
  <div class="progress" id="progress">Perkataan 1 / 7</div>
  
  <div class="btn-row">
    <button id="micBtn">🎤 Tekan & Sebut</button>
    <button id="nextBtn">Seterusnya ▶</button>
  </div>
  <div id="status">Sedia untuk mendengar...</div>
</div>
<script>
  const words = [
    { korean: "눈", malay: "Mata" },
    { korean: "입", malay: "Mulut" },
    { korean: "머리", malay: "Kepala" },
    { korean: "손가락", malay: "Jari" },
    { korean: "발", malay: "Kaki (bawah)" },
    { korean: "다리", malay: "Kaki (betis)" },
    { korean: "허벅지", malay: "Peha" }
  ];

  const encouragements = [
    "💡 Lihat perkataan di atas, kemudian tekan butang mikrofon dan sebut dengan lantang!",
    "🌟 Jangan malu! Sebutan yang baik bermula dengan keberanian mencuba.",
    "💪 Teruskan! Semakin kerap berlatih, semakin fasih sebutan anda.",
    "😊 Anda hampir berjaya! Cuba sekali lagi dengan yakin.",
    "🎯 Fokus dan sebut perlahan-lahan. Anda pasti boleh!",
    "🚀 Hebat! Teruskan semangat belajar bahasa Korea anda.",
    "🏆 Setiap percubaan membawa anda selangkah lebih dekat kejayaan!"
  ];

  let currentIndex = 0;

  const statusDiv = document.getElementById('status');
  const micBtn = document.getElementById('micBtn');
  const nextBtn = document.getElementById('nextBtn');
  const wordBox = document.getElementById('targetWord');
  const meaningDiv = document.getElementById('meaning');
  const progressDiv = document.getElementById('progress');
  const encourageBox = document.getElementById('encourageBox');

  function loadWord(index) {
    wordBox.innerText = words[index].korean;
    meaningDiv.innerText = words[index].malay;
    progressDiv.innerText = `Perkataan ${index + 1} / ${words.length}`;
    encourageBox.innerText = encouragements[index];
    statusDiv.innerText = "Sedia untuk mendengar...";
    statusDiv.className = "";
  }

  nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % words.length;
    loadWord(currentIndex);
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'ko-KR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    micBtn.addEventListener('click', () => {
      try {
        recognition.start();
        statusDiv.innerText = "Mendengar... Sila sebut sekarang!";
        statusDiv.className = "listening";
      } catch (e) {}
    });

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.trim();
      const targetWord = wordBox.innerText.trim();

      if (transcript === targetWord) {
        statusDiv.innerText = `Tepat sekali! Anda menyebut: "${transcript}" 🎉`;
        statusDiv.className = "success";
        encourageBox.innerText = "🎉 Luar biasa! Sebutan anda sangat tepat. Tekan 'Seterusnya' untuk perkataan baru!";
      } else {
        statusDiv.innerText = `Kurang tepat. Sistem dengar: "${transcript}". Cuba lagi!`;
        statusDiv.className = "error";
        encourageBox.innerText = "😊 Jangan putus asa! Cuba sebut sekali lagi dengan lebih perlahan dan jelas.";
      }
    };

    recognition.onerror = (event) => {
      if (event.error === 'not-allowed') {
        statusDiv.innerText = "Sila benarkan akses mikrofon pada pelayar web.";
        encourageBox.innerText = "⚙️ Pergi ke tetapan pelayar web anda dan benarkan akses mikrofon untuk meneruskan latihan.";
      } else {
        statusDiv.innerText = "Suara tidak jelas. Sila cuba lagi.";
        encourageBox.innerText = "🎙️ Pastikan anda bercakap dengan jelas dan tidak terlalu jauh dari mikrofon.";
      }
      statusDiv.className = "error";
    };

    recognition.onend = () => {
      if (statusDiv.className === "listening") {
        statusDiv.innerText = "Sedia untuk mendengar...";
        statusDiv.className = "";
      }
    };

  } else {
    statusDiv.innerText = "Maaf, peranti/pelayar web anda tidak menyokong fungsi mikrofon.";
    statusDiv.className = "error";
    micBtn.style.display = "none";
    encourageBox.innerText = "⚠️ Sila gunakan pelayar web Google Chrome atau Microsoft Edge untuk menggunakan fungsi ini.";
  }
</script>
</body>
</html>
