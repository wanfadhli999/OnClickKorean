<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Sebutan & Partikel Korea</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #eef4ff 0%, #ffffff 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .stage {
    width: 100%;
    max-width: 480px;
  }

  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 14px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #d7e3f7;
    transition: 0.25s;
  }
  .dot.active { background: #1a73e8; transform: scale(1.3); }
  .dot.done { background: #34a853; }

  .card {
    background: linear-gradient(145deg, #ffffff, #f8faff);
    border: 1px solid #e0eaf5;
    border-radius: 20px;
    padding: 30px 26px;
    box-shadow: 0 10px 28px rgba(26, 115, 232, 0.10);
    text-align: center;
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .card.correct { box-shadow: 0 0 0 3px #34a853 inset, 0 10px 28px rgba(52,168,83,0.18); }
  .card.wrong { animation: shake 0.4s; box-shadow: 0 0 0 3px #ea4335 inset, 0 10px 28px rgba(234,67,53,0.15); }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #1a73e8;
    background: #e8f0fe;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .badge.sentence { color: #b06000; background: #fff3cd; }

  .malay-prompt {
    font-size: 22px;
    font-weight: 700;
    color: #202124;
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .instruction {
    font-size: 13px;
    color: #5f6368;
    margin-bottom: 24px;
  }

  .mic-btn {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #1a73e8, #1558b0);
    color: white;
    font-size: 32px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(26,115,232,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .mic-btn:hover { transform: translateY(-2px); }
  .mic-btn:active { transform: scale(0.95); }
  .mic-btn.listening {
    background: linear-gradient(145deg, #ea4335, #c5221f);
    animation: pulse 1.1s infinite;
  }
  .mic-btn:disabled {
    background: #c7c7c7;
    cursor: not-allowed;
    box-shadow: none;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(234,67,53,0.45); }
    70% { box-shadow: 0 0 0 16px rgba(234,67,53,0); }
    100% { box-shadow: 0 0 0 0 rgba(234,67,53,0); }
  }

  .status {
    margin-top: 16px;
    font-size: 14px;
    color: #5f6368;
    min-height: 20px;
  }

  .heard-box {
    margin-top: 14px;
    font-size: 13px;
    color: #80868b;
    min-height: 18px;
  }
  .heard-box span { color: #3c4043; font-weight: 600; }

  .feedback {
    margin-top: 18px;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 700;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: #e6f4ea; color: #1e7e34; }
  .feedback.no { background: #fce8e6; color: #c5221f; }

  .hint-box {
    margin-top: 14px;
    background: #fff3cd;
    border-left: 4px solid #ffb300;
    padding: 10px 14px;
    border-radius: 4px 8px 8px 4px;
    font-size: 13px;
    color: #856404;
    text-align: left;
    display: none;
  }
  .hint-box.show { display: block; }

  .actions {
    margin-top: 22px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .btn-secondary {
    background: #fff;
    border: 1.5px solid #d7e3f7;
    color: #1a73e8;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 24px;
    cursor: pointer;
  }
  .btn-secondary:hover { background: #f4f8ff; }
  .btn-primary {
    background: #1a73e8;
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 24px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(26,115,232,0.3);
  }
  .btn-primary:hover { background: #1558b0; }

  .unsupported {
    margin-top: 16px;
    font-size: 13px;
    color: #c5221f;
    background: #fce8e6;
    padding: 10px 14px;
    border-radius: 8px;
  }

  .finished {
    text-align: center;
    padding: 40px 20px;
  }
  .finished h2 { color: #1a73e8; }
</style>
</head>
<body>

<div class="stage">
  <div class="progress-dots" id="progressDots"></div>
  <div class="card" id="card">
    <span class="badge" id="badge">PERKATAAN</span>
    <div class="malay-prompt" id="malayPrompt">Memuatkan...</div>
    <div class="instruction" id="instruction">Sebut dalam Bahasa Korea</div>

    <button class="mic-btn" id="micBtn">🎤</button>

    <div class="status" id="status">Sedia untuk mendengar...</div>
    <div class="heard-box" id="heardBox"></div>

    <div class="feedback" id="feedback"></div>
    <div class="hint-box" id="hintBox"></div>
    <div class="unsupported" id="unsupported" style="display:none;">
      ⚠️ Pelayar anda tidak menyokong pengecaman suara. Sila buka pautan ini menggunakan Google Chrome di komputer atau Android.
    </div>

    <div class="actions">
      <button class="btn-secondary" id="retryBtn">↻ Cuba Lagi</button>
      <button class="btn-primary" id="nextBtn">Seterusnya ▶</button>
    </div>
  </div>
</div>

<script>
// ---------- Data ----------
const items = [
  { type: 'word', malay: 'Mata', korean: '눈' },
  { type: 'word', malay: 'Telinga', korean: '귀' },
  { type: 'word', malay: 'Tangan', korean: '손' },
  { type: 'word', malay: 'Hidung', korean: '코' },
  { type: 'word', malay: 'Kaki', korean: '다리' },
  { type: 'sentence', malay: 'Berjalan menggunakan kaki.', korean: '다리로 걸어요' },
  { type: 'sentence', malay: 'Melihat menggunakan mata.', korean: '눈으로 봐요' },
  { type: 'sentence', malay: 'Menulis menggunakan tangan.', korean: '손으로 써요' },
  { type: 'sentence', malay: 'Sepak menggunakan kaki.', korean: '발로 차요' },
];

// ---------- State ----------
const params = new URLSearchParams(window.location.search);
let currentId = parseInt(params.get('id'), 10);
if (isNaN(currentId) || currentId < 0 || currentId >= items.length) currentId = 0;
let attempts = 0;
let solved = false;

// ---------- Elements ----------
const cardEl = document.getElementById('card');
const badgeEl = document.getElementById('badge');
const malayPromptEl = document.getElementById('malayPrompt');
const instructionEl = document.getElementById('instruction');
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const heardBoxEl = document.getElementById('heardBox');
const feedbackEl = document.getElementById('feedback');
const hintBoxEl = document.getElementById('hintBox');
const unsupportedEl = document.getElementById('unsupported');
const retryBtn = document.getElementById('retryBtn');
const nextBtn = document.getElementById('nextBtn');
const progressDotsEl = document.getElementById('progressDots');

// ---------- Progress dots ----------
function renderDots() {
  progressDotsEl.innerHTML = '';
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentId ? ' active' : '');
    progressDotsEl.appendChild(d);
  });
}

// ---------- Render item ----------
function renderItem() {
  attempts = 0;
  solved = false;
  const item = items[currentId];
  badgeEl.textContent = item.type === 'word' ? 'PERKATAAN' : 'AYAT · 로/으로';
  badgeEl.className = 'badge' + (item.type === 'sentence' ? ' sentence' : '');
  malayPromptEl.textContent = item.malay;
  instructionEl.textContent = item.type === 'word'
    ? 'Sebut perkataan ini dalam Bahasa Korea'
    : 'Sebut ayat ini dalam Bahasa Korea (guna partikel 로/으로 yang betul)';
  statusEl.textContent = 'Sedia untuk mendengar...';
  heardBoxEl.innerHTML = '';
  feedbackEl.className = 'feedback';
  feedbackEl.innerHTML = '';
  hintBoxEl.className = 'hint-box';
  hintBoxEl.innerHTML = '';
  cardEl.className = 'card';
  renderDots();
}
renderItem();

// ---------- Audio feedback (no external files needed) ----------
function playTone(freqs, type, duration) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let t = ctx.currentTime;
    freqs.forEach((f) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.02);
      t += duration * 0.55;
    });
  } catch (e) { /* ignore audio errors */ }
}
function playSuccess() { playTone([880, 1175, 1568], 'sine', 0.13); }
function playFail() { playTone([240, 180], 'sawtooth', 0.18); }

// ---------- Matching logic (lenient) ----------
function normalize(s) {
  return s.normalize('NFC').toLowerCase().replace(/[\s.,!?~"'`·]/g, '');
}
function levenshtein(a, b) {
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = a[i - 1] === b[j - 1]
        ? dp[i - 1][j - 1]
        : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[a.length][b.length];
}
function similarity(a, b) {
  if (!a.length && !b.length) return 1;
  const dist = levenshtein(a, b);
  return 1 - dist / Math.max(a.length, b.length);
}
function isMatch(transcript, expected) {
  const a = normalize(transcript);
  const b = normalize(expected);
  if (!a) return false;
  if (a === b) return true;
  if (a.includes(b) || b.includes(a)) return true;
  return similarity(a, b) >= 0.65; // lenient threshold
}

// ---------- Speech recognition ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if (!SpeechRecognition) {
  unsupportedEl.style.display = 'block';
  micBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.maxAlternatives = 5;
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    statusEl.textContent = '🔴 Mendengar... sebut sekarang!';
  };

  recognition.onerror = (e) => {
    listening = false;
    micBtn.classList.remove('listening');
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      statusEl.textContent = '⚠️ Akses mikrofon ditolak. Sila benarkan akses mikrofon.';
    } else if (e.error === 'no-speech') {
      statusEl.textContent = '🤔 Tidak dengar apa-apa. Cuba lagi.';
    } else {
      statusEl.textContent = '⚠️ Ralat: ' + e.error + '. Cuba lagi.';
    }
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
  };

  recognition.onresult = (event) => {
    const item = items[currentId];
    const results = event.results[0];
    let alternatives = [];
    for (let i = 0; i < results.length; i++) alternatives.push(results[i].transcript);

    heardBoxEl.innerHTML = 'Sistem dengar: <span>' + alternatives[0] + '</span>';

    const matched = alternatives.some((alt) => isMatch(alt, item.korean));
    handleResult(matched);
  };
}

micBtn.addEventListener('click', () => {
  if (!recognition || listening) return;
  feedbackEl.className = 'feedback';
  cardEl.className = 'card';
  try { recognition.start(); } catch (e) { /* already started */ }
});

const successMessages = [
  'Tahniah! 정답이에요! 🎉',
  'Hebat! Sebutan anda tepat! 👏',
  'Bagus! Anda berjaya! ⭐',
  'Sempurna! Cuba item seterusnya! 🌟',
];
const failMessages = [
  'Hampir! Cuba sebut sekali lagi 💪',
  'Belum tepat. Cuba lagi, anda boleh! 😊',
  'Dengar elok-elok dan cuba sekali lagi 🔁',
];

function handleResult(correct) {
  if (correct) {
    solved = true;
    cardEl.className = 'card correct';
    feedbackEl.className = 'feedback show ok';
    feedbackEl.textContent = '✅ ' + successMessages[Math.floor(Math.random() * successMessages.length)];
    hintBoxEl.className = 'hint-box';
    statusEl.textContent = 'Sedia untuk mendengar...';
    playSuccess();
  } else {
    attempts++;
    cardEl.className = 'card wrong';
    feedbackEl.className = 'feedback show no';
    feedbackEl.textContent = '❌ ' + failMessages[Math.floor(Math.random() * failMessages.length)];
    statusEl.textContent = 'Sedia untuk mendengar...';
    playFail();
    showHintIfNeeded();
  }
}

function showHintIfNeeded() {
  const item = items[currentId];
  if (attempts === 2) {
    hintBoxEl.className = 'hint-box show';
    if (item.type === 'word') {
      hintBoxEl.innerHTML = '💡 <strong>Petunjuk:</strong> Bermula dengan bunyi "' + item.korean.charAt(0) + '..."';
    } else {
      hintBoxEl.innerHTML = '💡 <strong>Ingat peraturan partikel:</strong> Jika perkataan berakhir dengan konsonan (받침, bukan ㄹ) → guna <strong>으로</strong>. Jika berakhir dengan huruf vokal atau ㄹ → guna <strong>로</strong>.';
    }
  } else if (attempts >= 3) {
    hintBoxEl.className = 'hint-box show';
    hintBoxEl.innerHTML = '💡 <strong>Jawapan penuh:</strong> ' + item.korean + '<br>Cuba sebut sekali lagi untuk berlatih!';
  }
}

retryBtn.addEventListener('click', () => {
  if (!recognition || listening) return;
  feedbackEl.className = 'feedback';
  cardEl.className = 'card';
  try { recognition.start(); } catch (e) {}
});

nextBtn.addEventListener('click', () => {
  if (currentId < items.length - 1) {
    currentId++;
    renderItem();
  } else {
    showFinished();
  }
});

function showFinished() {
  document.querySelector('.stage').innerHTML = `
    <div class="card finished">
      <h2>🎉 Tahniah!</h2>
      <p>Anda telah selesai semua latihan perkataan dan ayat.</p>
      <button class="btn-primary" onclick="window.location.search='?id=0'">↻ Mula Semula</button>
    </div>`;
}
</script>

</body>
</html>
